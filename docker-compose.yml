version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${AmoradbUser}
      POSTGRES_PASSWORD: ${AmoradbPassword}
      POSTGRES_DB: Amoradb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AmoradbUser} -d Amoradb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      AmoradbConnectionString: ${AmoradbConnectionString}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY} 
    ports:
      - "8080:8080"

volumes:
  db-data:

